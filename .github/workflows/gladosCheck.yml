name: auto check

on:
  workflow_dispatch:
  push:
    # 默认分支已由 master 改名为 main。这里改回 main 后才与分支名一致。
    # (历史教训: 2023-08-17 建文件起这里一直写 [main], 而仓库实际分支叫 master,
    #  导致 push 触发从未生效 —— 历史 27 次运行里 push 事件 0 次。)
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    # cron 用的是 UTC, 北京时间 = UTC + 8。故意错开整点: GitHub 文档明确说 schedule
    # 是 best-effort, 整点高峰会延迟甚至直接丢弃; 2026-08 底起还有大范围漂移事件。
    # 实测本仓库的 schedule 事件会迟到 3~10 小时 (workflow_dispatch 则秒级启动),
    # 所以一天留 4 个槽位互为兜底。第一个成功的槽位签到, 后面的槽位会直接跳过
    # (见下面的「今天是否已经签到成功」), 所以多留槽位既不会重复签到也不会重复扣分。
    - cron: '7 16 * * *'   # 16:07 UTC = 北京 00:07, 刚好越过账户签到日界点, 是当天第一次
    - cron: '23 22 * * *'  # 22:23 UTC = 北京 06:23, 凌晨兜底
    - cron: '41 4 * * *'   # 04:41 UTC = 北京 12:41, 第二锚点
    - cron: '13 10 * * *'  # 10:13 UTC = 北京 18:13, 白天兜底

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    # 4 个槽位互为兜底, 但一天只需要签到成功一次。成功之后后面的槽位直接跳过,
    # 不再打重复签到。
    # 标记就是 GitHub 自己的运行记录: 北京时间「今天」本工作流有没有成功运行过。
    # 脚本是 fail-closed 的 (只有签到成功 code 0 / 重复签到 code 1 才退出 0),
    # 所以「今天有成功运行」等价于「今天已经签到成功」。
    # 查询失败时回退为照常签到 —— 宁可多签一次, 也绝不静默漏签。
    - name: 今天是否已经签到成功
      id: today
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # 手动触发不跳过: 手动点意味着「现在就跑一次」, 否则排查问题时会被静默跳过。
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 手动触发, 不跳过, 照常签到。"
          exit 0
        fi
        # 北京时间今天 00:00 对应的 UTC 时刻 (北京 = UTC+8)
        since=$(TZ=Asia/Shanghai date -d 'today 00:00' -u +%Y-%m-%dT%H:%M:%SZ)
        count=0
        if raw=$(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/gladosCheck.yml/runs" \
              -f status=success -f "created=>=${since}" --jq '.total_count' 2>/dev/null); then
          count=${raw:-0}
        else
          echo "::warning::查询今天的成功运行记录失败, 无法判断是否已签到, 回退为照常签到。"
        fi
        case "${count}" in ''|*[!0-9]*) count=0 ;; esac
        echo "北京时间今天 00:00 = ${since} (UTC)"
        echo "本工作流今天的成功运行数: ${count}"
        if [ "${count}" -gt 0 ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "✅ 今天已经签到成功过, 跳过本次签到。"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 今天还没有成功记录, 执行签到。"
        fi

    - name: Set up Python ${{ matrix.python-version }}
      if: steps.today.outputs.skip != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      if: steps.today.outputs.skip != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install pypushdeer

    # 执行 签到脚本
    - name: Running checkin
      if: steps.today.outputs.skip != 'true'
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
        # GLaDOS 会校验签到请求的平台是否与登录浏览器一致, 平台不符会被判定为自动签到 (code 4)
        GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}

    # 签到失败时, 这两个收尾步骤也要照跑:
    # 用 if: always() 保证 keepalive 不会因为签到红了就被跳过, 否则工作流可能被
    # GitHub 判定为长期不活动而自动停用。作业本身仍会因为上面步骤失败而保持红色。
    - name: Keep alive
      if: always()
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      if: always()
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        # 保留更长的历史: schedule 漂移需要连续多天的触发时间才能看出来,
        # 原来 7 天会把排查漂移最需要的记录删掉。
        retain_days: 30
        keep_minimum_runs: 30
        delete_run_by_conclusion_pattern: success
